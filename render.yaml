services:
  - type: web
    name: trustlens-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustlens-postgres
          property: connectionString
      - key: ALLOWED_CORS_ORIGINS
        value: '["https://trustlens.vercel.app"]'

databases:
  - name: trustlens-postgres
    plan: free
    databaseName: trustlens_db
    user: trustlens_user


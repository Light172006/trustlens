# fly.toml app configuration file generated for trustlens-6-7amg on 2026-11-08T22:56:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trustlens-6-7amg'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  API_V1_PREFIX = '/api/v1'
  DEBUG = 'false'
  ENVIRONMENT = 'production'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# fly.toml configuration for TrustLens Backend
# See https://fly.io/docs/reference/configuration/ for reference.

app = 'trustlens'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8000'
  ENVIRONMENT = 'production'
  DEBUG = 'false'
  API_V1_PREFIX = '/api/v1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    protocol = 'http'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1


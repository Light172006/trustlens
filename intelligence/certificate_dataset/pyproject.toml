[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens-certificate-dataset"
version = "0.1.0"
description = "Production-grade X.509 Certificate Intelligence Dataset Engineering for TrustLens"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TrustLens PKI & Data Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"


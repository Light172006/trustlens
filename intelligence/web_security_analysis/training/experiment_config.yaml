# TrustLens Web Security Posture Model - Experiment Configuration
experiment:
  name: "web_security_posture_multiclass"
  version: "1.0.0"
  random_seed: 42
  target_column: "website_posture_label"
  classes:
    - "GOOD"
    - "MODERATE"
    - "POOR"

paths:
  train_data: "dataset/splits/train.parquet"
  val_data: "dataset/splits/validation.parquet"
  test_data: "dataset/splits/test.parquet"
  models_dir: "models"
  best_model_dir: "models/best_model"
  metadata_path: "models/model_metadata.json"
  eval_report_path: "reports/model_evaluation_report.json"
  eval_report_md: "reports/model_evaluation_report.md"

features:
  numerical:
    - "url_length"
    - "subdomain_count"
    - "tls_cert_san_count"
    - "tls_cert_remaining_days"
    - "tls_cert_key_size"
    - "redirect_count"
    - "final_status_code"
    - "header_hsts_max_age"
    - "cookie_count"
    - "cookie_secure_count"
    - "cookie_httponly_count"
    - "cookie_samesite_strict_count"
    - "cookie_samesite_lax_count"
    - "cookie_samesite_none_count"
  boolean:
    - "is_idn"
    - "is_ip_host"
    - "domain_resolved"
    - "dns_has_ipv4"
    - "dns_has_ipv6"
    - "dns_has_caa"
    - "tls_supported"
    - "tls_cert_valid"
    - "tls_cert_expired"
    - "tls_cert_is_self_signed"
    - "tls_cert_hostname_match"
    - "http_available"
    - "https_available"
    - "http_to_https_redirect"
    - "https_downgrade"
    - "header_hsts_present"
    - "header_hsts_include_subdomains"
    - "header_hsts_preload"
    - "header_csp_present"
    - "header_csp_unsafe_inline"
    - "header_csp_unsafe_eval"
    - "header_xfo_present"
    - "header_xcto_present"
    - "header_referrer_policy_present"
    - "header_permissions_policy_present"
    - "header_coop_present"
    - "header_corp_present"
    - "header_coep_present"
    - "cookie_all_secure"
    - "cookie_all_httponly"
    - "server_version_exposed"
    - "x_powered_by_present"
  categorical:
    - "tls_version"
    - "final_scheme"
    - "server_vendor"

candidates:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
    solver: "lbfgs"
  random_forest:
    n_estimators: 200
    max_depth: 14
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    n_jobs: -1
  extra_trees:
    n_estimators: 200
    max_depth: 14
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    n_jobs: -1
  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.06
    max_depth: 8
    min_samples_leaf: 10
    class_weight: "balanced"

calibration:
  method: "sigmoid" # Platt scaling
  cv: "prefit"


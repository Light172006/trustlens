[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens-backend"
version = "1.0.0"
description = "TrustLens Unified Website Security & Threat Assessment Platform"
authors = [{ name = "TrustLens Security Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.1",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "dnspython>=2.6.1",
    "cryptography>=43.0.1",
    "pyjwt[crypto]>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC" # flake8-async
]
ignore = [
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "E501", # line too long (handled by ruff format)
    "B904", # within except clause, raise ... from err
    "C901", # function too complex (security validators and test doubles are necessarily branchy)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "dnspython.*",
    "dns.*",
    "pwdlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
pythonpath = [".", ".."]

